<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM | Swiss Archival Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #E8E0D0;
            --fg: #2A2520;
            --surface: #EFE9DC;
            --accent: #8B1A1A;
            --accent-hover: #A02020;
            --muted: #DDD5C5;
            --muted-fg: #7A7068;
            --blueprint: rgba(191, 182, 166, 0.2);
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 12px;
            --motion-fast: 150ms;
            --motion-normal: 225ms;
            --ease-state: cubic-bezier(0.65, 0, 0.35, 1);
            --max-width: 80rem;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--fg);
            background: var(--bg);
            font-family: "Plus Jakarta Sans", sans-serif;
            line-height: 1.6;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(
                    to right,
                    transparent 0,
                    transparent calc((100% - var(--max-width)) / 2),
                    var(--blueprint) calc((100% - var(--max-width)) / 2),
                    var(--blueprint) calc((100% - var(--max-width)) / 2 + 1px),
                    transparent calc((100% - var(--max-width)) / 2 + 1px),
                    transparent calc((100% - var(--max-width)) / 2 + ((var(--max-width) / 12) * 1))
                );
            opacity: 0.7;
            z-index: -2;
        }

        .paper-noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.04;
        }

        .archive-shell {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1rem;
        }

        .archive-header {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--muted);
        }

        .archive-brand h1 {
            margin: 0;
            font-size: 2.25rem;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .archive-brand p {
            margin: 0.25rem 0 0;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-fg);
        }

        .archive-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .archive-nav-btn {
            border: 1px solid var(--muted);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--fg);
            padding: 0.5rem 0.75rem;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color var(--motion-fast) var(--ease-state), color var(--motion-fast) var(--ease-state), border-color var(--motion-fast) var(--ease-state);
        }

        .archive-nav-btn:hover,
        .archive-nav-btn:focus-visible {
            background: color-mix(in srgb, var(--accent) 8%, var(--surface));
            border-color: color-mix(in srgb, var(--accent) 40%, var(--muted));
            outline: none;
        }

        .archive-nav-btn.active {
            background: var(--accent);
            color: #EFE9DC;
            border-color: var(--accent);
        }

        .archive-hero {
            padding: 2rem 0 1.5rem;
            border-bottom: 1px solid var(--muted);
        }

        .archive-meta {
            margin: 0;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-fg);
        }

        #hero-title {
            margin: 0.75rem 0;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        #category-label {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }

        #loading {
            display: grid;
            place-items: center;
            min-height: 40vh;
        }

        .archive-loader-panel {
            border: 1px solid var(--muted);
            border-radius: var(--radius-md);
            background: var(--surface);
            padding: 1rem;
            text-align: left;
            width: min(32rem, 100%);
        }

        #news-feed {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1rem;
            padding: 1.5rem 0 3rem;
        }

        .archive-card {
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: grid;
            gap: 1rem;
            transition: border-color var(--motion-normal) var(--ease-state), transform var(--motion-normal) var(--ease-state);
        }

        .archive-card:hover {
            border-color: color-mix(in srgb, var(--accent) 35%, var(--muted));
            transform: translateY(-1px);
        }

        .archive-visual {
            border: 1px solid var(--muted);
            border-radius: var(--radius-sm);
            background: color-mix(in srgb, var(--surface) 85%, var(--bg));
            min-height: 8rem;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .archive-visual svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .archive-card-head {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .archive-title {
            margin: 0;
            font-size: 1.25rem;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .archive-title a {
            color: inherit;
            text-decoration: none;
        }

        .archive-title a:hover {
            color: var(--accent);
        }

        .archive-note {
            margin: 0;
            color: var(--muted-fg);
            font-size: 0.875rem;
        }

        .archive-card-foot {
            border-top: 1px solid var(--muted);
            padding-top: 0.75rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: end;
            flex-wrap: wrap;
        }

        .archive-card-foot dl {
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
            min-width: 16rem;
        }

        .archive-card-foot dt {
            font: 600 0.625rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            color: var(--muted-fg);
        }

        .archive-card-foot dd {
            margin: 0.35rem 0 0;
            font-size: 0.875rem;
            font-weight: 500;
            word-break: break-word;
        }

        .archive-comments {
            text-decoration: none;
            border: 1px solid var(--muted);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.65rem;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--fg);
            transition: background-color var(--motion-fast) var(--ease-state), color var(--motion-fast) var(--ease-state), border-color var(--motion-fast) var(--ease-state);
        }

        .archive-comments:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #EFE9DC;
        }

        .archive-empty {
            grid-column: 1 / -1;
        }

        /* --- VISUAL MEDIA (IMAGE / SPECIMEN) --- */
        .archive-visual img.archive-img {
            width: 100%;
            height: 100%;
            min-height: 8rem;
            max-height: 12rem;
            object-fit: cover;
            display: block;
            filter: contrast(0.96) sepia(0.06);
            transition: filter var(--motion-fast) var(--ease-state), transform var(--motion-fast) var(--ease-state);
        }

        .archive-card:hover .archive-visual img.archive-img {
            filter: contrast(1.02) sepia(0);
            transform: scale(1.02);
        }

        /* --- PAGINATION (SWISS ARCHIVAL) --- */
        .archive-pagination-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            margin: 1.5rem 0 3rem;
            padding: 1.25rem 1rem;
            background: var(--surface);
            border: 1px solid var(--muted);
            border-radius: var(--radius-md);
        }

        .archive-pagination-info {
            margin: 0;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-fg);
            text-align: center;
        }

        .archive-pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.35rem;
        }

        .archive-page-btn {
            border: 1px solid var(--muted);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--fg);
            padding: 0.45rem 0.65rem;
            font: 600 0.75rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color var(--motion-fast) var(--ease-state), color var(--motion-fast) var(--ease-state), border-color var(--motion-fast) var(--ease-state);
        }

        .archive-page-btn:hover:not(:disabled) {
            background: color-mix(in srgb, var(--accent) 12%, var(--surface));
            border-color: var(--accent);
            color: var(--accent);
        }

        .archive-page-btn.active {
            background: var(--accent);
            color: #EFE9DC;
            border-color: var(--accent);
            cursor: default;
        }

        .archive-page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: var(--muted);
        }

        /* --- FLY-OUT BACK TO TOP (BTT) BUTTON --- */
        .archive-btt {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 99999;
            border: 1.5px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #EFE9DC;
            padding: 0.65rem 0.95rem;
            font: 700 0.8125rem/1 "JetBrains Mono", monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(139, 26, 26, 0.28), 0 2px 6px rgba(42, 37, 32, 0.15);
            /* FLY-OUT INITIAL STATE: Parked completely off-screen to the right */
            transform: translateX(calc(100% + 2.5rem));
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.25s ease,
                        background-color var(--motion-fast) var(--ease-state),
                        box-shadow var(--motion-fast) var(--ease-state);
        }

        /* FLY-OUT ACTIVE STATE: Slides in smoothly from the right when user scrolls */
        .archive-btt.visible {
            transform: translateX(0) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .archive-btt:hover {
            background: var(--accent-hover);
            color: #FFFFFF;
            transform: translateX(-3px) !important;
            box-shadow: 0 6px 22px rgba(139, 26, 26, 0.36), 0 3px 8px rgba(42, 37, 32, 0.2);
        }

        .archive-btt:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 48rem) {
            .archive-btt {
                bottom: 1.5rem;
                right: 1.25rem;
                padding: 0.55rem 0.8rem;
                font-size: 0.75rem;
            }
        }

        @media (min-width: 48rem) {
            .archive-shell { padding: 1.5rem; }
            #news-feed { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 80rem) {
            #news-feed { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <svg class="paper-noise" aria-hidden="true">
        <filter id="archive-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch"></feTurbulence>
        </filter>
        <rect width="100%" height="100%" filter="url(#archive-noise)"></rect>
    </svg>

    <div class="archive-shell">
        <header class="archive-header">
            <div class="archive-brand">
                <h1>PRISM</h1>
                <p>Digital Archive Bulletin</p>
            </div>
            <nav class="archive-nav">
                <button onclick="loadCategory('tech')" id="btn-tech" class="archive-nav-btn active">Tech</button>
                <button onclick="loadCategory('edan')" id="btn-edan" class="archive-nav-btn">Edan</button>
                <button onclick="loadCategory('ai')" id="btn-ai" class="archive-nav-btn">AI</button>
                <button onclick="loadCategory('design')" id="btn-design" class="archive-nav-btn">Design</button>
                <button onclick="loadCategory('science')" id="btn-science" class="archive-nav-btn">Science</button>
                <button onclick="loadCategory('world')" id="btn-world" class="archive-nav-btn">World</button>
                <button onclick="loadCategory('business')" id="btn-business" class="archive-nav-btn">Business</button>
                <button onclick="loadCategory('gaming')" id="btn-gaming" class="archive-nav-btn">Gaming</button>
                <button onclick="loadCategory('entertainment')" id="btn-entertainment" class="archive-nav-btn">Media</button>
                <button onclick="loadCategory('music')" id="btn-music" class="archive-nav-btn">Music</button>
                <button onclick="loadCategory('sports')" id="btn-sports" class="archive-nav-btn">Sports</button>
                <button onclick="loadCategory('food')" id="btn-food" class="archive-nav-btn">Food</button>
                <button onclick="loadCategory('travel')" id="btn-travel" class="archive-nav-btn">Travel</button>
                <button onclick="loadCategory('health')" id="btn-health" class="archive-nav-btn">Health</button>
                <button onclick="loadCategory('other')" id="btn-other" class="archive-nav-btn">Other</button>
            </nav>
        </header>

        <section class="archive-hero">
            <p class="archive-meta">CURATED CATEGORY</p>
            <h2 id="hero-title">Technological Frontier</h2>
            <p id="category-label">A chronological record of signals selected from live sources.</p>
        </section>

        <main>
            <section id="loading">
                <div class="archive-loader-panel">
                    <p class="archive-meta">LOADING</p>
                    <p>Fetching current records from the selected category.</p>
                </div>
            </section>
            <section id="news-feed"></section>
            <nav id="pagination-wrap" class="archive-pagination-wrap" style="display: none;" aria-label="Pagination controls"></nav>
        </main>
    </div>

    <!-- FLY-OUT BACK TO TOP BUTTON -->
    <button id="btt-btn" class="archive-btt" aria-label="Back to top" onclick="scrollToTop()">[ ↑ TOP ]</button>

    <script>
        (function() {
            function updateBTT() {
                var btn = document.getElementById("btt-btn");
                if (!btn) return;
                var st = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
                if (st > 80) {
                    btn.classList.add("visible");
                } else {
                    btn.classList.remove("visible");
                }
            }
            window.addEventListener("scroll", updateBTT, { passive: true });
            window.addEventListener("resize", updateBTT, { passive: true });
            document.addEventListener("scroll", updateBTT, { passive: true });
            if (document.body) document.body.addEventListener("scroll", updateBTT, { passive: true });
            window.scrollToTop = function() {
                window.scrollTo({ top: 0, behavior: "smooth" });
                if (document.documentElement) document.documentElement.scrollTo({ top: 0, behavior: "smooth" });
                if (document.body) document.body.scrollTo({ top: 0, behavior: "smooth" });
            };
            setTimeout(updateBTT, 100);
        })();
    </script>

    <script src="app.js?v=swiss-archival-v4"></script>
</body>
</html>
