<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991C1C"/>
      <stop offset="100%" stop-color="#701212"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Swiss-Archival Squary Badge (56px corner radius) -->
  <rect width="512" height="512" rx="56" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="48" fill="none" stroke="#FAF6EE" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Registration Corner Marks -->
  <path d="M44,28 v20 M34,38 h20 M468,28 v20 M458,38 h20 M44,464 v20 M34,474 h20 M468,464 v20 M458,474 h20" stroke="#FAF6EE" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Prism Triangle -->
  <polygon points="256,112 116,380 396,380" fill="rgba(250, 246, 238, 0.12)" stroke="#FAF6EE" stroke-width="26" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Optical Axis / Center Guideline -->
  <line x1="256" y1="112" x2="256" y2="380" stroke="#FAF6EE" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8"/>

  <!-- Incident White Beam (Strikes left facet at x=190, y=258) -->
  <line x1="44" y1="190" x2="190" y2="258" stroke="#FAF6EE" stroke-width="26" stroke-linecap="round"/>

  <!-- Internal Dispersion Beams -->
  <line x1="190" y1="258" x2="310" y2="238" stroke="#FAF6EE" stroke-width="12" stroke-opacity="0.45"/>
  <line x1="190" y1="258" x2="322" y2="265" stroke="#FAF6EE" stroke-width="12" stroke-opacity="0.45"/>
  <line x1="190" y1="258" x2="334" y2="292" stroke="#FAF6EE" stroke-width="12" stroke-opacity="0.45"/>

  <!-- Spectral Refracted Rays emerging from right facet -->
  <!-- Ray 1: Red / Coral -->
  <line x1="310" y1="238" x2="472" y2="185" stroke="#FF7B72" stroke-width="20" stroke-linecap="round"/>
  <!-- Ray 2: Amber / Gold -->
  <line x1="322" y1="265" x2="480" y2="265" stroke="#F6C177" stroke-width="20" stroke-linecap="round"/>
  <!-- Ray 3: Cyan / Teal -->
  <line x1="334" y1="292" x2="472" y2="345" stroke="#9CCFD8" stroke-width="20" stroke-linecap="round"/>
</svg>
